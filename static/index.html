<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FSPEN — Live Enhancement</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body data-ui-version="3">
  <header>
    <h1>FSPEN — fullband denoise &amp; dereverb</h1>
    <p class="subtitle">48 kHz · Используйте <strong>наушники</strong> чтобы избежать эхо</p>
  </header>

  <section class="model-bar">
    <label>
      Model
      <select id="selPreset"></select>
    </label>
    <label class="chunk-label">
      Chunk (ms)
      <input type="number" id="inpChunkMs" min="50" max="3000" step="50" value="500" />
    </label>
    <button id="btnApplyModel" type="button" class="secondary">Apply model</button>
    <div class="rtf-panel" title="Real-time factor: chunk_duration / inference_time (≥1 = faster than real time)">
      <span class="rtf-label">RTF</span>
      <span id="rtfValue" class="rtf-value">—</span>
    </div>
    <span id="modelStatus" class="model-status"></span>
  </section>

  <nav class="tabs" role="tablist">
    <button type="button" class="tab active" data-tab="live" role="tab" aria-selected="true">Live</button>
    <button type="button" class="tab" data-tab="file" role="tab" aria-selected="false">File</button>
  </nav>

  <section id="panelLive" class="tab-panel active" role="tabpanel">
    <div class="controls">
      <button id="btnStart" type="button">Start</button>
      <button id="btnStop" type="button" disabled>Stop</button>
      <label class="toggle">
        <input type="checkbox" id="chkEnhanced" checked />
        Enhanced
      </label>
      <button id="btnMutePlayback" type="button" class="secondary" aria-pressed="false">
        Monitor: on
      </button>
      <span id="status" class="status">Idle</span>
    </div>

    <section class="specs">
      <div class="spec-panel">
        <h2>Input</h2>
        <canvas id="specIn" width="512" height="256"></canvas>
      </div>
      <div class="spec-panel">
        <h2>Output</h2>
        <canvas id="specOut" width="512" height="256"></canvas>
      </div>
    </section>

    <div class="hint">
      <p><strong>Enhanced</strong> — выход модели · <strong>Bypass</strong> — сухой сигнал с той же задержкой.</p>
      <p><strong>Monitor off</strong> — спектрограммы без звука в наушниках.</p>
    </div>
  </section>

  <section id="panelFile" class="tab-panel" role="tabpanel" hidden>
    <div class="file-controls">
      <label class="file-picker">
        <span>Audio file</span>
        <input type="file" id="fileInput" accept="audio/*,.wav,.flac,.ogg,.mp3,.m4a" />
      </label>
      <label class="toggle">
        <input type="checkbox" id="chkChunked" />
        Chunked (long files)
      </label>
      <button id="btnProcessFile" type="button" disabled>Process</button>
    </div>
    <p id="fileStatus" class="file-status">Select a file, then Process.</p>
    <p id="fileRtfLine" class="file-rtf-line" hidden></p>
    <a id="fileDownload" class="download-link" href="#" download hidden>Download enhanced WAV</a>
  </section>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
